<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="4개 지점 병원 홈페이지 제안용 데모: 게이트웨이, 지점별 홈, 진료과 상세, 온라인 진료 예약·조회, 게시판, 통합 관리자">
<title>누리온병원 (예시) · 병원 홈페이지 제안용 데모</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231E56D6'/%3E%3Cpath d='M13 8h6v5h5v6h-5v5h-6v-5H8v-6h5z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme:light;
  --brand:#1E56D6; --brand-hover:#1846B4; --brand-text:#1846B4; --brand-tint:#EAF0FD; --brand-tint-2:#CCDAF8;
  --ring:0 0 0 3px rgba(30,86,214,.28);
  --bg:#F4F2EE; --paper:#FBFAF7; --card:#FFFFFF; --soft:#F6F5F1; --track:#ECEAE4;
  --line:#E0DDD5; --line-2:#E8E5DE;
  --ink:#16181C; --ink-2:#43474F; --mut:#5F6570; --mut-2:#9A9EA6;
  --ok:#127A4F; --ok-bg:#E3F6ED; --ok-dot:#1FA971;
  --warn:#7A5600; --warn-bg:#FFF3D4; --warn-dot:#F2B01E;
  --bad:#BF2930; --bad-bg:#FFE3E4; --bad-dot:#E5484D;
  --info:#175CD3; --info-bg:#EAF2FF; --info-dot:#2E7CF6;
  --neu:#4E5968; --neu-bg:#EEEDEA; --neu-dot:#8B95A1;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:28px; --r-pill:999px;
  --sh-pop:0 2px 6px rgba(16,24,40,.06),0 12px 32px rgba(16,24,40,.14);
  --gut:16px; --demobar:48px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;padding-bottom:calc(var(--demobar) + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img{max-width:100%;display:block}
svg{flex:none}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0;letter-spacing:-.02em;line-height:1.25}
p{margin:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--ink);color:#fff;padding:12px 16px;border-radius:var(--r-md);font-weight:700;text-decoration:none}
.skip:focus{top:12px}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--gut)}
.num{font-variant-numeric:tabular-nums}
.ex{font-size:12px;font-weight:500;color:var(--mut);letter-spacing:0}
.mut{color:var(--mut)}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--r-pill);border:1px solid transparent;font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn-pri{background:var(--brand);color:#fff}
.btn-pri:hover{background:var(--brand-hover)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{background:#2c3038}
.btn-line{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--ink);color:#fff}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn-sm{min-height:44px;padding:0 16px;font-size:14px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.btn.loading{pointer-events:none;opacity:.7}
.btn-block{width:100%}

/* 데모 띠 */
.demobar{position:fixed;left:0;right:0;bottom:0;z-index:120;background:#111317;color:#D5D7DC;font-size:13px;display:flex;align-items:center;gap:8px;padding:6px 8px calc(6px + env(safe-area-inset-bottom)) 12px;min-height:var(--demobar)}
.demobar .tag{flex:none;background:#F3D36B;color:#111;border-radius:6px;padding:2px 8px;font-weight:700;font-size:12px}
.demobar .msg{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demobar nav{display:flex;gap:4px;flex:none}
.demobar a{flex:none;color:#fff;text-decoration:none;font-weight:600;font-size:13px;padding:0 12px;min-height:36px;display:inline-flex;align-items:center;border-radius:8px;background:#262a31}
.demobar a[aria-current="page"]{background:#fff;color:#111}
@media (max-width:560px){.demobar .msg .long{display:none}.demobar a.opt{display:none}}

/* 헤더 */
.hd{position:sticky;top:0;z-index:60;background:rgba(244,242,238,.94);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.hd .in{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:8px;min-height:44px;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:-.03em;white-space:nowrap}
.logo .mk{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.logo small{font-size:12px;font-weight:500;color:var(--mut)}
.brpick{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}
.gnb{display:none;margin-left:auto;gap:4px}
.gnb a{font-size:13px;font-weight:700;letter-spacing:.06em;text-decoration:none;padding:10px 12px;border-radius:var(--r-pill);color:var(--ink-2)}
.gnb a:hover{background:var(--track);color:var(--ink)}
.gnb a[aria-current="page"]{color:var(--ink);background:var(--track)}
.hd .cta{display:none}
.burger{margin-left:auto;width:44px;height:44px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
@media (min-width:960px){.gnb{display:flex}.hd .cta{display:inline-flex}.burger{display:none}}
.sheet{position:fixed;inset:0;z-index:150;background:rgba(17,19,23,.45);display:flex;align-items:flex-end}
.sheet .panel{background:var(--paper);width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;padding:12px var(--gut) calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet a{display:flex;align-items:center;justify-content:space-between;min-height:56px;border-bottom:1px solid var(--line);text-decoration:none;font-size:18px;font-weight:700}

/* 공통 섹션 */
.sec{padding:56px 0}
.sec-hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.sec-hd h2{font-size:28px}
.kicker{font-size:13px;font-weight:700;color:var(--mut);margin-bottom:8px}
.rule{border:0;border-top:1px solid var(--line);margin:0}
.card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg)}
@media (min-width:768px){.sec{padding:96px 0}.sec-hd h2{font-size:40px}}

/* 게이트웨이 */
.gw-top{padding-top:40px;padding-bottom:24px}
.gw-top h1{font-size:clamp(46px,12.4vw,148px);font-weight:800;letter-spacing:-.055em;line-height:.95}
.gw-top .lead{margin-top:20px;font-size:17px;color:var(--ink-2);max-width:560px}
.gw-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok-dot)}
.branches{display:grid;gap:12px;padding-bottom:24px}
.br{position:relative;display:grid;grid-template-columns:1fr;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);overflow:hidden}
.br figure{margin:0;aspect-ratio:16/9;background:#ddd;overflow:hidden}
.br figure img{width:100%;height:100%;object-fit:cover}
.br .bd{padding:20px}
.br h2{font-size:40px;font-weight:800;letter-spacing:-.04em;display:flex;align-items:baseline;gap:8px}
.br h2 small{font-size:15px;font-weight:600;color:var(--mut);letter-spacing:0}
.br .info{margin-top:12px;display:grid;gap:4px;font-size:14px;color:var(--ink-2)}
.br .info span b{font-weight:600;color:var(--ink)}
.br .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.br .acts .btn{flex:1}
@media (min-width:768px){.branches{grid-template-columns:1fr 1fr}.br h2{font-size:52px}}
@media (min-width:1100px){.branches{grid-template-columns:repeat(4,1fr)}.br h2{font-size:56px}.br figure{aspect-ratio:4/3}}
.gw-strip{display:grid;gap:12px;padding-top:24px;padding-bottom:56px}
.gw-strip .card{padding:20px}
.gw-strip h3{font-size:17px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.gw-strip h3 a{font-size:13px;font-weight:600;color:var(--mut);min-height:44px;display:inline-flex;align-items:center}
@media (min-width:900px){.gw-strip{grid-template-columns:2fr 1fr}}
.callbox{background:var(--ink)!important;color:#fff;border:0!important}
.callbox .big{font-size:36px;font-weight:800;letter-spacing:-.03em;margin:4px 0 8px}
.callbox p{color:#C9CCD2;font-size:14px}

/* 리스트 줄 */
.rows{list-style:none;margin:0;padding:0}
.rows li{border-top:1px solid var(--line)}
.rows li:last-child{border-bottom:1px solid var(--line)}
.rows a,.rows button.rowbtn{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 4px;text-decoration:none;width:100%;background:none;border:0;text-align:left}
.rows a:hover .t{text-decoration:underline;text-underline-offset:3px}
.rows .t{flex:1;min-width:0;font-weight:600}
.rows .d{font-size:13px;color:var(--mut);white-space:nowrap}
.badge{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:var(--r-pill);font-size:12px;font-weight:700;background:var(--track);color:var(--ink-2);white-space:nowrap}
.badge.b{background:var(--brand-tint);color:var(--brand-text)}

/* 지점 홈 */
.hero{padding-top:32px}
.hero .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.hero h1{font-size:clamp(88px,23vw,220px);font-weight:800;letter-spacing:-.06em;line-height:.9}
.hero .sub{display:grid;gap:20px;margin-top:20px}
.hero .sub p{font-size:17px;color:var(--ink-2);max-width:520px}
.hero .ctas{display:flex;gap:8px;flex-wrap:wrap}
.hero figure{margin:28px 0 0;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:4/3;background:#ddd;position:relative}
.hero figure img{width:100%;height:100%;object-fit:cover}
.hero figcaption{position:absolute;right:12px;bottom:12px;background:rgba(17,19,23,.6);color:#fff;font-size:12px;padding:4px 8px;border-radius:6px}
@media (min-width:768px){.hero .sub{grid-template-columns:1fr auto;align-items:end}.hero figure{aspect-ratio:21/8}}
.hours{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);margin-top:32px}
.hours div{padding:16px 0;border-bottom:1px solid var(--line)}
.hours div:nth-child(odd){padding-right:12px}
.hours dt{font-size:13px;color:var(--mut);font-weight:600}
.hours dd{margin:4px 0 0;font-size:24px;font-weight:700;letter-spacing:-.02em}
.hours dd small{font-size:13px;font-weight:500;color:var(--mut)}
@media (min-width:768px){.hours{grid-template-columns:repeat(4,1fr)}.hours div{padding:20px 16px 20px 0}.hours dd{font-size:32px}}
.today{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:0 10px;min-height:28px;border-radius:var(--r-pill)}
.today.open{background:var(--ok-bg);color:var(--ok)}
.today.closed{background:var(--neu-bg);color:var(--neu)}
.today i{width:8px;height:8px;border-radius:50%;background:currentColor}

.svc{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.svc li{border-bottom:1px solid var(--line)}
.svc a{display:grid;grid-template-columns:40px 1fr 44px;align-items:center;gap:8px;padding:20px 0;text-decoration:none;min-height:72px}
.svc .n{font-size:13px;font-weight:600;color:var(--mut)}
.svc .nm{font-size:24px;font-weight:700;letter-spacing:-.03em}
.svc .ds{grid-column:2;font-size:14px;color:var(--mut);margin-top:-4px}
.svc .ar{grid-row:1;grid-column:3;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .15s,color .15s}
.svc a:hover .ar{background:var(--ink);color:#fff;border-color:var(--ink)}
@media (min-width:900px){.svc a{grid-template-columns:72px 280px 1fr 44px;padding:24px 0}.svc .nm{font-size:32px}.svc .ds{grid-column:3;margin:0;font-size:15px}.svc .ar{grid-column:4}}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--ink)}
.stats div{padding:20px 0;border-bottom:1px solid var(--line)}
.stats b{display:block;font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1}
.stats b sup{font-size:24px;vertical-align:top;margin-left:2px}
.stats span{display:block;margin-top:8px;font-size:14px;color:var(--ink-2)}
@media (min-width:768px){.stats{grid-template-columns:repeat(4,1fr)}.stats div{padding:28px 16px 28px 0}.stats b{font-size:88px}}

.split{display:grid;gap:24px}
@media (min-width:900px){.split{grid-template-columns:1fr 1fr;gap:48px;align-items:start}}
.map{border-radius:var(--r-lg);background:repeating-linear-gradient(0deg,transparent 0 39px,#E3E0D8 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,#E3E0D8 39px 40px),#EFEDE7;aspect-ratio:4/3;position:relative;overflow:hidden;border:1px solid var(--line)}
.map .road{position:absolute;background:#fff;border:1px solid #DAD6CC}
.map .pin{position:absolute;left:50%;top:46%;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:8px 12px;border-radius:var(--r-pill);white-space:nowrap}
.map .pin::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}
.map .note{position:absolute;left:12px;bottom:12px;font-size:12px;background:rgba(255,255,255,.9);padding:4px 8px;border-radius:6px;color:var(--ink-2)}
.dl{display:grid;gap:0;margin:0}
.dl div{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.dl dt{color:var(--mut);font-weight:600}
.dl dd{margin:0}

/* 진료과 상세 */
.crumb{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--mut);padding-top:24px}
.crumb a{color:var(--mut);text-decoration:none;min-height:24px}
.crumb a:hover{color:var(--ink);text-decoration:underline}
.dhero{padding:16px 0 32px;display:grid;gap:20px}
.dhero h1{font-size:clamp(52px,15vw,144px);font-weight:800;letter-spacing:-.055em;line-height:.95}
.dhero p{font-size:17px;color:var(--ink-2);max-width:620px}
@media (min-width:900px){.dhero{grid-template-columns:1fr 380px;align-items:end}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:var(--r-pill);background:var(--card);border:1px solid var(--line);font-size:14px;font-weight:600}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--ink)}
.steps li{display:grid;grid-template-columns:40px 1fr;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.steps li b{display:block;font-size:17px}
.steps li span{font-size:14px;color:var(--mut)}
.steps .k{font-size:13px;font-weight:700;color:var(--mut);padding-top:2px}
@media (min-width:900px){.steps{grid-template-columns:repeat(5,1fr)}.steps li{grid-template-columns:1fr;border-bottom:0;border-right:1px solid var(--line);padding:20px 16px 20px 0}.steps li:last-child{border-right:0}}
.docs{display:grid;gap:12px}
@media (min-width:768px){.docs{grid-template-columns:1fr 1fr}}
.doc{padding:20px;display:grid;grid-template-columns:64px 1fr;gap:16px;align-items:start}
.doc .av{width:64px;height:64px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--ink-2)}
.doc h3{font-size:20px}
.doc h3 small{font-size:13px;font-weight:600;color:var(--mut);margin-left:4px}
.doc p{font-size:14px;color:var(--ink-2);margin-top:4px}
.tt{width:100%;border-collapse:collapse;font-size:13px;margin-top:12px;grid-column:1/-1}
.tt th,.tt td{border:1px solid var(--line);text-align:center;padding:6px 2px;font-weight:600}
.tt thead th{background:var(--soft);color:var(--mut)}
.tt td.on{color:var(--brand-text)}
.tt td.off{color:var(--mut-2)}
.notice-box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;font-size:14px;color:var(--ink-2)}
.notice-box b{color:var(--ink)}
.notice-box ul{margin:8px 0 0;padding-left:18px}
.others{display:flex;flex-wrap:wrap;gap:8px}
.others a{text-decoration:none}

/* 폼 */
.fwrap{max-width:720px;margin:0 auto;padding:32px var(--gut) 64px}
.fwrap h1{font-size:40px;font-weight:800;letter-spacing:-.04em}
.fwrap .lead{color:var(--ink-2);margin-top:8px}
.prog{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:24px 0 8px;list-style:none;padding:0}
.prog li{font-size:12px;font-weight:700;color:var(--mut);padding-top:10px;border-top:3px solid var(--line)}
.prog li.on{color:var(--ink);border-color:var(--ink)}
.prog li.done{color:var(--ink-2);border-color:var(--brand)}
.panel{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:20px;margin-top:16px}
.panel h2{font-size:20px;margin-bottom:4px}
.panel .help{font-size:14px;color:var(--mut);margin-bottom:16px}
@media (min-width:768px){.panel{padding:28px}}
.opt{display:flex;flex-wrap:wrap;gap:8px}
.opt button{min-height:44px;padding:0 16px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--card);font-weight:600;font-size:15px}
.opt button:hover{border-color:var(--ink-2)}
.opt button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt button[disabled]{color:var(--mut-2);background:var(--soft);text-decoration:line-through;cursor:not-allowed}
.dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.dates button{flex:none;width:60px;min-height:68px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);display:grid;place-items:center;align-content:center;gap:0;font-weight:700}
.dates button small{font-size:12px;font-weight:600;color:var(--mut)}
.dates button.sun small,.dates button.sun{color:var(--bad)}
.dates button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.dates button[aria-pressed="true"] small{color:#C9CCD2}
.dates button[disabled]{background:var(--soft);color:var(--mut-2);cursor:not-allowed}
.dates button[disabled] small{color:var(--mut-2)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (min-width:600px){.slots{grid-template-columns:repeat(6,1fr)}}
.slots button{min-height:44px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.slots button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}

    else if (a==='lookup') { html = viewLookup(); title = '예약 조회 · 누리온병원 (예시)'; }
    else if (a==='news' && b2==='p' && c) { html = viewPost(c); title = '소식 · 누리온병원 (예시)'; }
    else if (a==='news') { html = viewBoard(b2||'notice', q); title = '소식 · 누리온병원 (예시)'; }
    else if (a==='admin') { html = viewAdmin(b2||'dash', q); title = '통합 관리자 (데모)'; }
    else { html = `<div class="wrap empty"><b>페이지를 찾을 수 없어요</b>주소를 확인하거나 첫 화면으로 가 주세요.<br><a class="btn btn-ink" href="#/">첫 화면으로</a></div>`; }
  } catch(e){ console.error(e); html = `<div class="wrap empty"><b>화면을 불러오지 못했어요</b><a class="btn btn-ink" href="#/">첫 화면으로</a></div>`; }
  $('#hd').innerHTML = a==='admin' ? '' : header(a, b2);
  $('#ft').innerHTML = a==='admin' ? '' : footer();
  $('#main').innerHTML = html;
  document.title = title;
  $$('.demobar a').forEach(x=>x.toggleAttribute('aria-current', false));
  const dm = !a ? 'home' : a==='reserve' ? 'reserve' : a==='admin' ? 'admin' : '';
  if (dm) $(`.demobar a[data-dm="${dm}"]`).setAttribute('aria-current','page');
  bind(a, parts, q);
}

/* ---------- 예약 ---------- */
let R = null;
function resetR(q){ R = {step:1, branch: q.b && bOf(q.b) ? q.b : '', dept: q.d && DP[q.d] ? q.d : '', date:'', time:'', name:'', birth:'', phone:'', carrier:'SKT', memo:'', code:'', sent:false, verified:false, agree1:false, agree2:false, done:null}; }
function taken(branch, dept, date){ return DB.res.filter(x=>x.branch===branch&&x.dept===dept&&x.date===date&&x.status!=='cx').map(x=>x.time); }
function viewReserve(q){
  if (!R || q.fresh || R.done || (q.b && q.b!==R.branch && R.step===1)) resetR(q);
  return `<div class="fwrap"><p class="kicker">온라인 진료 예약</p><h1 id="rvT">진료 예약</h1><p class="lead">회원가입 없이 휴대폰 본인인증으로 예약해요. 병원이 확인하면 문자로 확정 안내를 드려요.</p>
    <ol class="prog" aria-label="예약 단계">${['진료과','날짜·시간','본인인증','확인'].map((s,i)=>`<li class="${R.step===i+1?'on':R.step>i+1?'done':''}"${R.step===i+1?' aria-current="step"':''}>${i+1}. ${s}</li>`).join('')}</ol>
    <div id="rvBody">${reserveStep()}</div></div>`;
}
function reserveStep(){
  if (R.done) {
    const x = R.done, b = bOf(x.branch);
    return `<div class="panel"><div class="done-hd"><div class="ok">${ic.check}</div><h2 style="font-size:24px">예약을 신청했어요</h2><p class="mut" style="margin-top:4px">${esc(b.name)}에서 확인하면 '확정'으로 바뀌고 문자를 보내 드려요.</p></div>
      <p class="kicker" style="margin-top:20px">예약번호</p><p class="rno" id="doneNo">${x.id}</p>
      <dl class="sum" style="margin-top:12px"><div><dt>지점·진료과</dt><dd>${esc(b.name)} · ${DP[x.dept].name}</dd></div><div><dt>일시</dt><dd>${fmtD(x.date)} ${x.time}</dd></div><div><dt>상태</dt><dd>${stChip(x.status)}</dd></div></dl>
      <div class="factions"><a class="btn btn-ghost" href="#/b/${x.branch}">지점 홈</a><a class="btn btn-ink" href="#/lookup">예약 조회하기</a></div></div>`;
  }
  const s = R.step;
  if (s===1){
    const b = R.branch ? bOf(R.branch) : null;
    return `<div class="panel"><h2>어느 지점에서 진료받을까요?</h2><p class="help">지점마다 있는 진료과가 달라요.</p>
      <div class="opt" role="group" aria-label="지점">${BR.map(x=>`<button type="button" data-br="${x.id}" aria-pressed="${R.branch===x.id}">${esc(x.name)}</button>`).join('')}</div></div>
      <div class="panel"${b?'':' aria-disabled="true"'}><h2>진료과를 골라 주세요</h2><p class="help">${b?`${esc(b.name)}에는 ${b.depts.length}개 진료과가 있어요.`:'지점을 먼저 고르면 진료과가 나와요.'}</p>
      ${b?`<div class="opt" role="group" aria-label="진료과">${b.depts.map(d=>`<button type="button" data-dp="${d}" aria-pressed="${R.dept===d}">${DP[d].name}</button>`).join('')}</div>`:''}</div>
      <p class="err" id="rErr" role="alert" hidden></p>
      <div class="factions"><button class="btn btn-ink" data-next="2" type="button">다음: 날짜 고르기</button></div>`;
  }
  if (s===2){
    const days = Array.from({length:21},(_,i)=>addDays(TODAY,i+1));
    const tk = R.date ? taken(R.branch,R.dept,R.date) : [];
    const sat = R.date && new Date(R.date+'T00:00:00').getDay()===6;
    const bb = bOf(R.branch), lunchS = bb.lunch.slice(0,5), lunchE = bb.lunch.slice(-5);
    const am = SLOTS_AM.filter(t=>t>=bb.wk[0] && t<(sat?bb.sat[1]:lunchS)), pm = SLOTS_PM.filter(t=>t>=lunchE && t<bb.wk[1]);
    const slotBtns = arr => arr.map(t=>{ const off = tk.includes(t); return `<button type="button" data-tm="${t}" aria-pressed="${R.time===t}" ${off?'disabled aria-label="'+t+' 예약 마감"':''}>${t}</button>`; }).join('');
    return `<div class="panel"><h2>날짜</h2><p class="help">${esc(bOf(R.branch).name)} · ${DP[R.dept].name} · 일요일은 휴진이에요.</p>
      <div class="dates" role="group" aria-label="날짜">${days.map(d=>{ const v=ymd(d), sun=d.getDay()===0; return `<button type="button" class="${sun?'sun':''}" data-dt="${v}" aria-pressed="${R.date===v}" ${sun?'disabled':''} aria-label="${fmtD(v)}${sun?' 휴진':''}"><small>${WD[d.getDay()]}</small>${d.getDate()}</button>`; }).join('')}</div></div>
      <div class="panel"><h2>시간</h2><p class="help">${R.date?`${fmtD(R.date)} · 줄 그어진 시간은 이미 마감됐어요.`:'날짜를 고르면 남은 시간이 나와요.'}</p>
      ${R.date?`<p class="slot-h">오전</p><div class="slots">${slotBtns(am)}</div>${sat?'<p class="hint" style="margin-top:12px">토요일은 오전만 진료해요.</p>':`<p class="slot-h">오후 · 점심시간 ${bb.lunch} 제외</p><div class="slots">${slotBtns(pm)}</div>`}`:''}</div>
      <p class="err" id="rErr" role="alert" hidden></p>
      <div class="factions"><button class="btn btn-ghost" data-next="1" type="button">이전</button><button class="btn btn-ink" data-next="3" type="button">다음: 본인인증</button></div>`;
  }
  if (s===3){
    return `<div class="panel"><h2>본인인증</h2><p class="help">회원가입 대신 휴대폰 인증으로 예약하고, 같은 방법으로 조회·취소해요.</p>
      <div class="pass-note">${ic.shield} 실제 사이트에서는 이 자리에 PASS·NICE 같은 본인인증 업체 창이 열려요. 데모에서는 화면에 보이는 인증번호를 넣으면 돼요.</div>
      ${R.verified?`<div class="verified">${I('<path d="m5 12 5 5L20 7"/>',18)} ${esc(R.name)}님, 본인인증을 마쳤어요</div>`:`
      <div class="fld"><label for="rn">이름<span class="req" aria-hidden="true">*</span></label><input id="rn" class="inp" autocomplete="name" value="${esc(R.name)}" required></div>
      <div class="fld"><label for="rb">생년월일 8자리<span class="req" aria-hidden="true">*</span></label><input id="rb" class="inp" inputmode="numeric" maxlength="8" placeholder="19850312" value="${esc(R.birth)}" required></div>
      <div class="fld"><span class="lb" id="carL">통신사</span><div class="opt" role="group" aria-labelledby="carL">${['SKT','KT','LG U+','알뜰폰'].map(c=>`<button type="button" data-car="${c}" aria-pressed="${R.carrier===c}">${c}</button>`).join('')}</div></div>
      <div class="fld"><label for="rp">휴대폰 번호<span class="req" aria-hidden="true">*</span></label><div class="inl"><input id="rp" class="inp" inputmode="numeric" autocomplete="tel" placeholder="01012345678" value="${esc(R.phone)}" required><button class="btn btn-ghost btn-sm" type="button" id="sendCode">${R.sent?'다시 받기':'인증번호 받기'}</button></div></div>
      ${R.sent?`<div class="fld"><label for="rc">인증번호 6자리</label><div class="inl"><input id="rc" class="inp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn btn-ink btn-sm" type="button" id="checkCode">확인</button></div><p class="hint" id="codeHint">데모 인증번호: <b class="num">${R.code}</b> · 3분 안에 입력해 주세요</p></div>`:''}`}
      </div>
      <div class="panel"><h2>증상 메모 <span class="mut" style="font-size:14px;font-weight:500">(선택)</span></h2><p class="help">진료에 참고해요. 길게 쓰지 않아도 돼요.</p><textarea id="rm" class="inp" aria-label="증상 메모" maxlength="200">${esc(R.memo)}</textarea></div>
      <div class="panel"><h2>동의</h2>
        <label class="chk"><input type="checkbox" id="ag1" ${R.agree1?'checked':''}><span>[필수] 개인정보 수집·이용 동의 (이름·생년월일·휴대폰, 진료 예약 목적, 진료 후 법정 기간 보관)</span></label>
        <label class="chk"><input type="checkbox" id="ag2" ${R.agree2?'checked':''}><span>[필수] 민감정보(증상 메모) 처리 동의</span></label></div>
      <p class="err" id="rErr" role="alert" hidden></p>
      <div class="factions"><button class="btn btn-ghost" data-next="2" type="button">이전</button><button class="btn btn-ink" data-next="4" type="button">다음: 확인</button></div>`;
  }
  const b = bOf(R.branch);
  return `<div class="panel"><h2>이대로 예약할까요?</h2><p class="help">신청 후 병원이 확인하면 확정 문자를 보내 드려요.</p>
    <dl class="sum"><div><dt>지점</dt><dd>${esc(b.name)}</dd></div><div><dt>진료과</dt><dd>${DP[R.dept].name}</dd></div><div><dt>일시</dt><dd>${fmtD(R.date)} ${R.time}</dd></div><div><dt>예약자</dt><dd>${esc(R.name)} · ${maskPhone(R.phone)}</dd></div>${R.memo?`<div><dt>메모</dt><dd>${esc(R.memo)}</dd></div>`:''}</dl></div>
    <div class="factions"><button class="btn btn-ghost" data-next="3" type="button">이전</button><button class="btn btn-pri" type="button" id="submitR">예약 신청하기</button></div>`;
}
const normPhone = v => { const d = v.replace(/\D/g,''); return /^01\d{8,9}$/.test(d) ? d.replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3') : null; };
function rErr(msg){ const e = $('#rErr'); if (!e) return; e.textContent = msg; e.hidden = !msg; }
function rerenderR(focusSel){
  $('#rvBody').innerHTML = reserveStep();
  $$('.prog li').forEach((li,i)=>{ li.className = R.step===i+1?'on':R.step>i+1?'done':''; li.toggleAttribute('aria-current', R.step===i+1); if(R.step===i+1) li.setAttribute('aria-current','step'); });
  if (focusSel){ const el = $(focusSel); el && el.focus(); }
}
function bindReserve(){
  const body = $('#rvBody');
  body.addEventListener('input', e=>{
    const t = e.target;
    if (t.id==='rn') R.name = t.value.trim();
    if (t.id==='rb') R.birth = t.value.replace(/\D/g,'');
    if (t.id==='rp') R.phone = t.value;
    if (t.id==='rm') R.memo = t.value;
  });
  body.addEventListener('change', e=>{ if (e.target.id==='ag1') R.agree1 = e.target.checked; if (e.target.id==='ag2') R.agree2 = e.target.checked; });
  body.addEventListener('click', async e=>{
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.br){ if (R.branch!==t.dataset.br){ R.branch = t.dataset.br; if (!bOf(R.branch).depts.includes(R.dept)) R.dept=''; R.date=''; R.time=''; } rerenderR(`[data-br="${R.branch}"]`); return; }
    if (t.dataset.dp){ R.dept = t.dataset.dp; R.date=''; R.time=''; rerenderR(`[data-dp="${R.dept}"]`); return; }
    if (t.dataset.dt){ R.date = t.dataset.dt; R.time=''; rerenderR(`[data-dt="${R.date}"]`); return; }
    if (t.dataset.tm){ R.time = t.dataset.tm; rerenderR(`[data-tm="${R.time}"]`); return; }
    if (t.dataset.car){ R.carrier = t.dataset.car; rerenderR(`[data-car="${R.carrier}"]`); return; }
    if (t.id==='sendCode'){
      if (!R.name) return rErr('이름을 입력해 주세요.');
      if (!/^(19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$/.test(R.birth)) return rErr('생년월일 8자리를 19850312처럼 입력해 주세요.');
      const p = normPhone(R.phone); if (!p) return rErr('휴대폰 번호 10~11자리를 숫자로 입력해 주세요.');
      R.phone = p; R.sent = true; R.code = String(100000 + Math.floor(Math.random()*900000));
      rerenderR('#rc'); toast('인증번호를 보냈어요 (데모)'); return;
    }
    if (t.id==='checkCode'){
      const v = ($('#rc').value||'').trim();
      if (v!==R.code){ $('#rc').setAttribute('aria-invalid','true'); return rErr('인증번호가 맞지 않아요. 화면의 6자리 숫자를 다시 확인해 주세요.'); }
      R.verified = true; rerenderR('#rm'); toast('본인인증을 마쳤어요'); return;
    }
    if (t.dataset.next){
      const n = +t.dataset.next;
      if (n > R.step){
        if (R.step===1 && (!R.branch || !R.dept)) return rErr(!R.branch ? '지점을 골라 주세요.' : '진료과를 골라 주세요.');
        if (R.step===2 && (!R.date || !R.time)) return rErr(!R.date ? '날짜를 골라 주세요.' : '시간을 골라 주세요.');
        if (R.step===3){ if (!R.verified) return rErr('휴대폰 본인인증을 먼저 마쳐 주세요.'); if (!R.agree1||!R.agree2) return rErr('필수 동의 두 가지에 체크해 주세요.'); }
      }
      R.step = n; rerenderR(); window.scrollTo(0,0); $('#rvBody h2') && ($('#rvBody h2').tabIndex=-1, $('#rvBody h2').focus()); return;
    }
    if (t.id==='submitR'){
      if (taken(R.branch,R.dept,R.date).includes(R.time)){ toast('방금 다른 분이 이 시간을 예약했어요. 시간을 다시 골라 주세요.'); R.step=2; R.time=''; return rerenderR(); }
      t.classList.add('loading'); t.textContent = '신청하는 중…';
      await new Promise(r=>setTimeout(r,500));
      const now = new Date();
      const x = {id:`R${String(now.getFullYear()).slice(2)}${pad(now.getMonth()+1)}-${String(DB.seq++).padStart(4,'0')}`, branch:R.branch, dept:R.dept, date:R.date, time:R.time, name:R.name, birth:R.birth, phone:R.phone, memo:R.memo, status:'req', createdAt:now.toISOString()};
      DB.res.push(x); log(`예약 신청 ${x.id} (${bOf(x.branch).name} ${DP[x.dept].name})`, '환자(비회원)'); save();
      R.done = x; rerenderR(); $('#rvBody h2').tabIndex=-1; $('#rvBody h2').focus();
    }
  });
}

/* ---------- 예약 조회·취소 ---------- */
let L = {name:'', phone:'', sent:false, code:'', ok:false};
function viewLookup(){
  return `<div class="fwrap"><p class="kicker">비회원 예약 조회</p><h1 id="lkT">예약 조회·취소</h1><p class="lead">예약할 때 인증한 이름과 휴대폰 번호로 조회해요.</p><div id="lkBody">${lookupBody()}</div></div>`;
}
function lookupBody(){
  if (!L.ok) return `<div class="panel"><div class="pass-note">${ic.shield} 실제 사이트는 PASS 등 본인인증 업체로 확인해요. 데모에서는 화면의 인증번호를 넣으면 돼요.</div>
    <div class="fld"><label for="ln">이름</label><input id="ln" class="inp" autocomplete="name" value="${esc(L.name)}"></div>
    <div class="fld"><label for="lp">휴대폰 번호</label><div class="inl"><input id="lp" class="inp" inputmode="numeric" autocomplete="tel" placeholder="01012345678" value="${esc(L.phone)}"><button class="btn btn-ghost btn-sm" type="button" id="lSend">${L.sent?'다시 받기':'인증번호 받기'}</button></div></div>
    ${L.sent?`<div class="fld"><label for="lc">인증번호 6자리</label><div class="inl"><input id="lc" class="inp" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><button class="btn btn-ink btn-sm" type="button" id="lCheck">조회하기</button></div><p class="hint">데모 인증번호: <b class="num">${L.code}</b></p></div>`:''}
    <p class="err" id="lErr" role="alert" hidden></p></div>`;
  const mine = DB.res.filter(x=>x.name===L.name && x.phone===L.phone).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const today = ymd(TODAY);
  return `<p style="margin-top:16px"><b>${esc(L.name)}</b>님 예약 <b class="num">${mine.length}</b>건 <button class="btn btn-ghost btn-sm" style="margin-left:8px" id="lOut" type="button">다른 번호로 조회</button></p>
    ${mine.length? `<div class="rcards">${mine.map(x=>{ const can = (x.status==='req'||x.status==='cf') && x.date>today; return `<article class="card rcard"><div class="top"><span class="num mut" style="font-size:13px">${x.id}</span>${stChip(x.status)}</div>
      <h3>${esc(bOf(x.branch).name)} · ${DP[x.dept].name}</h3><p>${fmtD(x.date)} ${x.time}</p>
      ${x.status==='cf'?'<p style="margin-top:4px">병원에서 예약을 확정했어요. 10분 전까지 와 주세요.</p>':x.status==='req'?'<p style="margin-top:4px">병원이 확인하고 있어요.</p>':''}
      ${can?`<div class="acts"><button class="btn btn-ghost btn-sm" data-cancel="${x.id}" type="button">예약 취소하기</button></div>`:''}</article>`; }).join('')}</div>`
    : `<div class="empty card" style="margin-top:16px"><b>조회된 예약이 없어요</b>예약할 때 쓴 이름과 번호가 맞는지 확인해 주세요.<br><a class="btn btn-ink" href="#/reserve?fresh=1">진료 예약하기</a></div>`}`;
}
function bindLookup(){
  const body = $('#lkBody');
  const re = f => { body.innerHTML = lookupBody(); f && $(f) && $(f).focus(); };
  body.addEventListener('input', e=>{ if (e.target.id==='ln') L.name = e.target.value.trim(); if (e.target.id==='lp') L.phone = e.target.value; });
  body.addEventListener('click', async e=>{
    const t = e.target.closest('button'); if (!t) return;
    const err = m => { const x=$('#lErr'); x.textContent=m; x.hidden=!m; };
    if (t.id==='lSend'){ if (!L.name) return err('이름을 입력해 주세요.'); const p = normPhone(L.phone); if (!p) return err('휴대폰 번호 10~11자리를 숫자로 입력해 주세요.'); L.phone = p; L.sent = true; L.code = String(100000+Math.floor(Math.random()*900000)); re('#lc'); return; }
    if (t.id==='lCheck'){ if (($('#lc').value||'').trim()!==L.code) return err('인증번호가 맞지 않아요. 다시 확인해 주세요.'); L.ok = true; re(); body.querySelector('p').tabIndex=-1; body.querySelector('p').focus(); return; }
    if (t.id==='lOut'){ L = {name:'', phone:'', sent:false, code:'', ok:false}; re('#ln'); return; }
    if (t.dataset.cancel){
      const x = DB.res.find(r=>r.id===t.dataset.cancel);
      if (!await confirmBox('예약을 취소할까요?', `${bOf(x.branch).name} ${DP[x.dept].name} · ${fmtD(x.date)} ${x.time}`, '예약 취소하기')) return;
      x.status = 'cx'; x.canceledBy = '환자'; log(`예약 취소 ${x.id} (환자 직접)`, '환자(비회원)'); save(); re(); toast('예약을 취소했어요');
    }
  });
}

/* ---------- 게시판 ---------- */
const BT = {notice:'공지사항', press:'언론보도', faq:'자주 묻는 질문'};
let BQ = {page:1};
function viewBoard(type, q){
  if (!BT[type]) type = 'notice';
  const bf = q.b && bOf(q.b) ? q.b : 'all';
  const kw = (q.q||'').trim();
  let items = DB.posts.filter(p=>p.type===type && (bf==='all' || p.branch==='all' || p.branch===bf) && (!kw || (p.title+p.body).includes(kw)));
  items.sort((a,b)=> (b.pin-a.pin) || b.date.localeCompare(a.date));
  const per = 8, pages = Math.max(1, Math.ceil(items.length/per)); const pg = Math.min(+q.p||1, pages);
  const shown = items.slice((pg-1)*per, pg*per);

    if (t.dataset.ans){ const x = DB.inq.find(i=>i.id===t.dataset.ans); x.status='답변완료'; x.answer = ($('#an-'+x.id).value||'').trim() || '처리함'; log(`문의 답변 완료 ${x.id}`); save(); render(); toast('답변 완료로 표시했어요'); return; }
    if (t.dataset.del){ const p = DB.posts.find(i=>i.id===t.dataset.del); if (!await confirmBox('이 글을 내릴까요?', p.title, '내리기')) return; DB.posts = DB.posts.filter(i=>i.id!==p.id); log(`게시글 내림: ${p.title}`); save(); render(); toast('글을 내렸어요'); return; }
    if (t.id==='resetDemo'){ if (!await confirmBox('데모 데이터를 되돌릴까요?', '직접 넣은 예약·문의·글이 모두 처음 상태로 돌아가요.', '되돌리기')) return; try{localStorage.removeItem(KEY)}catch(e){} R=null; load(); render(); toast('처음 상태로 되돌렸어요'); }
  };
  m.onchange = e=>{
    const t = e.target;
    if (t.dataset.st){ const x = DB.res.find(r=>r.id===t.dataset.st); const from = ST[x.status]; x.status = t.value; log(`예약 상태 변경 ${x.id}: ${from} → ${ST[x.status]}`); save(); toast(`${x.id}을 '${ST[x.status]}'(으)로 바꿨어요`); const id = t.id; render(); $('#'+CSS.escape(id)) && $('#'+CSS.escape(id)).focus(); return; }
    if (t.id==='arb'){ ADM.rb = t.value; render(); $('#arb').focus(); }
  };
  const q = $('#arq'); if (q) q.addEventListener('input', ()=>{ ADM.rq = q.value; clearTimeout(q.t); q.t = setTimeout(()=>{ const pos = q.selectionStart; render(); const n = $('#arq'); n.focus(); n.setSelectionRange(pos,pos); }, 250); });
  const f = $('#postForm'); if (f) f.addEventListener('submit', e=>{
    e.preventDefault();
    const title = $('#ptt').value.trim(), body = $('#pbd').value.trim(); const er = $('#pErr');
    if (!title || !body){ er.textContent = !title ? '제목을 입력해 주세요.' : '내용을 입력해 주세요.'; er.hidden = false; (!title?$('#ptt'):$('#pbd')).focus(); return; }
    const p = {id:'P'+Date.now(), type:$('#pt').value, branch:$('#pb').value, title, body, date:ymd(new Date()), pin:$('#ppin').checked, views:0};
    DB.posts.push(p); log(`게시글 등록 [${BT[p.type]}] ${title}`); save(); render(); toast('홈페이지에 올렸어요');
  });
}

/* ---------- 연결 ---------- */
function bind(a, parts, q){
  const bm = $('[data-act="menu"]'); if (bm) bm.onclick = openMenu;
  if (a==='reserve') bindReserve();
  if (a==='lookup') bindLookup();
  if (a==='admin') bindAdmin(parts[1]); else { $('#main').onclick = null; $('#main').onchange = null; }
  if (a==='news'){
    const f = $('#bdSearch');
    if (f){ const go = ()=>{ const b=$('#bdB').value, s=$('#bdQ').value.trim(); const p = new URLSearchParams({...(b!=='all'?{b}:{}), ...(s?{q:s}:{})}).toString(); location.hash = `#/news/${parts[1]||'notice'}${p?'?'+p:''}`; };
      f.addEventListener('submit', e=>{ e.preventDefault(); go(); }); $('#bdB').addEventListener('change', go); }
    $$('[data-pg]').forEach(b=>b.onclick=()=>{ const p = new URLSearchParams(q); p.set('p', b.dataset.pg); location.hash = `#/news/${parts[1]||'notice'}?${p}`; });
  }
  const inq = $('#inqForm');
  if (inq) inq.addEventListener('submit', e=>{
    e.preventDefault();
    const n=$('#qn').value.trim(), p=normPhone($('#qp').value), body=$('#qb').value.trim(), er=$('#qErr');
    const fail = (m, el)=>{ er.textContent=m; er.hidden=false; el.setAttribute('aria-invalid','true'); el.focus(); };
    $$('#inqForm [aria-invalid]').forEach(x=>x.removeAttribute('aria-invalid'));
    if (!n) return fail('이름을 입력해 주세요.', $('#qn'));
    if (!p) return fail('휴대폰 번호 10~11자리를 숫자로 입력해 주세요.', $('#qp'));
    if (!body) return fail('문의 내용을 입력해 주세요.', $('#qb'));
    if (!$('#qa').checked) return fail('개인정보 수집·이용에 동의해 주세요.', $('#qa'));
    DB.inq.push({id:'Q'+Date.now(), branch:CUR_BR||'pt', name:n, phone:p, type:$('#qt').value, body, status:'미답변', createdAt:new Date().toISOString()});
    log(`문의 접수 (${bOf(CUR_BR||'pt').name})`, '방문자'); save(); inq.reset(); er.hidden=true; toast('문의를 남겼어요. 담당자가 연락드릴게요');
  });
  // 같은 페이지 앵커(#depts, #visit) 처리
  $$('a[href^="#"]').forEach(x=>{ const h = x.getAttribute('href'); if (/^#[a-z]+$/.test(h)) x.addEventListener('click', ev=>{ ev.preventDefault(); const el = document.getElementById(h.slice(1)); if (el){ el.scrollIntoView({behavior:'smooth'}); el.setAttribute('tabindex','-1'); el.focus({preventScroll:true}); } }); });
}
render(); firstRender = false;
(()=>{ const sub = location.hash.split('#')[2]; if (sub){ const el = document.getElementById(sub); el && el.scrollIntoView(); } })();
</script>
